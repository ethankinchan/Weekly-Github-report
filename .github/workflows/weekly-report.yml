name: Weekly GitHub Hot Repositories

on:
  schedule:
    - cron: '0 5 * * 5'   # Every Friday at 05:00 UTC (13:00 Beijing Time)
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write           # Needed to commit reports back to the repo
  pages: write              # Needed to deploy to GitHub Pages
  id-token: write           # Needed for OIDC token (Pages deployment)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history so existing site/reports/ files are present

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_report.py

      - name: Commit new report to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/
          # Only commit if there are staged changes
          git diff --staged --quiet || git commit -m "chore: weekly report $(date -u +%G-W%V)"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
